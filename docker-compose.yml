# Sonarr, Plex, and the preview/live switch are saved from the Admin page.
services:
  trimarr:
    build: .
    image: trimarr:latest
    container_name: trimarr
    restart: unless-stopped
    ports:
      - "${PORT:-8787}:8787"
    volumes:
      - ${HOST_DATA_DIR:-./data}:/data
    environment:
      DATA_DIR: /data
      PORT: "8787"
      PUID: ${PUID:-99}
      PGID: ${PGID:-100}
      TZ: ${TZ:-UTC}
